[tool:pytest]
# Pytest configuration for Cantonese-Mandarin Translation System

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Add src to Python path
pythonpath = src

# Verbose output
addopts = 
    -v
    --strict-markers
    --tb=short
    --durations=10
    --color=yes

# Coverage configuration
# Run with: pytest --cov=src --cov-report=html

# Markers for different test categories
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    gpu: marks tests that require GPU
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    model: marks tests that require model loading
    api: marks tests as API tests

# Filter warnings
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::FutureWarning

# Timeout configuration
# Install pytest-timeout: pip install pytest-timeout
# timeout = 300  # 5 minutes default timeout

# Parallel testing
# Install pytest-xdist: pip install pytest-xdist
# Run with: pytest -n auto

# HTML report
# Install pytest-html: pip install pytest-html
# Run with: pytest --html=report.html --self-contained-html