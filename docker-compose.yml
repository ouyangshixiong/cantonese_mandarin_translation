version: '3.8'

services:
  # CPU-based translation service
  translation-cpu:
    build:
      context: .
      dockerfile: docker/Dockerfile.cpu
    image: cantonese-translation:cpu
    container_name: cantonese-translation-cpu
    ports:
      - "8001:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - WORKERS=2
      - FRAMEWORK=pytorch
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./outputs:/app/outputs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - translation-network

  # GPU-based translation service
  translation-gpu:
    build:
      context: .
      dockerfile: docker/Dockerfile.gpu
    image: cantonese-translation:gpu
    container_name: cantonese-translation-gpu
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - WORKERS=1
      - FRAMEWORK=pytorch
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./outputs:/app/outputs
      - ./checkpoints:/app/checkpoints
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - translation-network

  # Load balancer (nginx)
  nginx:
    image: nginx:alpine
    container_name: translation-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
    depends_on:
      - translation-gpu
      - translation-cpu
    restart: unless-stopped
    networks:
      - translation-network

  # Monitoring (Prometheus)
  prometheus:
    image: prom/prometheus:latest
    container_name: translation-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - translation-network

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: translation-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - translation-network

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: translation-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - translation-network

  # PostgreSQL for metadata
  postgres:
    image: postgres:15-alpine
    container_name: translation-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=translation_db
      - POSTGRES_USER=translation_user
      - POSTGRES_PASSWORD=translation_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    networks:
      - translation-network

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  redis_data:
    driver: local
  postgres_data:
    driver: local

networks:
  translation-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

